<!DOCTYPE html>
<html lang="es">
<head>

    <title>Laboratorio - Unidades CSS</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Laboratorio de Unidades CSS</h1>
    <p>Experimentando con px, %, rem, vw, vh y fr</p>
</header>
<main>

    <section><h2>2. Unidad %</h2><div class="contenedor-porcentaje"><div class="elemento-porcentaje">50%</div></div></section>
    <section><h2>3. Unidad rem</h2><div class="ejemplo-rem">Texto y espaciado con rem</div></section>
    <section><h2>4. Unidades vw y vh</h2><div class="ejemplo-viewport">Elemento relacionado con el viewport</div></section>
    <section><h2>5. Unidad fr</h2><div class="grid"><div>Columna 1</div><div>Columna 2</div><div>Columna 3</div></div></section>
</main>
</body>
